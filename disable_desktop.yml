---
# Ansible Playbook to Disable Desktop Environment on Kali VMs with Reboot
# HARDENED VERSION - Prevents TTY switching and escape attempts
# Run with: ansible-playbook disable_desktop_hardened.yml
# Run without reboot: ansible-playbook disable_desktop_hardened.yml --skip-tags reboot

- name: Disable Desktop Environment and Setup CLI-Only Mode
  hosts: kali_vms
  become: yes
  gather_facts: yes
  
  vars:
    # Path to local image file to transfer (leave empty to auto-generate on hosts)
    local_image_path: "/home/kali/Desktop/Windows-CDT-Blue-Script/desktop.png"  # Example: "{{ playbook_dir }}/cli_instruction.png"
    remote_image_path: "/home/redteam/desktop.png"
    username: "{{ ansible_user }}"
    
  tasks:
    - name: Display configuration start
      debug:
        msg: "Starting desktop environment removal on {{ inventory_hostname }}"
    
    # ============================================
    # TRANSFER IMAGE (if specified)
    # ============================================
    
    - name: Check if local image exists
      local_action:
        module: stat
        path: "{{ local_image_path }}"
      register: local_image_stat
      when: local_image_path != ""
      
    - name: Transfer instruction image to remote host
      copy:
        src: "{{ local_image_path }}"
        dest: "{{ remote_image_path }}"
        mode: '0644'
      when: 
        - local_image_path != ""
        - local_image_stat.stat.exists is defined
        - local_image_stat.stat.exists
    
    # ============================================
    # DISABLE DESKTOP MANAGERS
    # ============================================
    
    - name: Stop all display managers
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - gdm3
        - gdm
        - lightdm
        - sddm
        - xdm
      ignore_errors: yes
      
    - name: Disable display managers from starting on boot
      systemd:
        name: "{{ item }}"
        enabled: no
      loop:
        - gdm3
        - gdm
        - lightdm
        - sddm
        - xdm
      ignore_errors: yes
    
    - name: Set default target to multi-user (text mode)
      command: systemctl set-default multi-user.target
      changed_when: true
    
    - name: Display desktop environment disabled message
      debug:
        msg: "✓ Desktop environment disabled on {{ inventory_hostname }}"
    
    # ============================================
    # INSTALL REQUIRED PACKAGES
    # ============================================
    
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      
    - name: Install minimal X server and image viewer packages
      apt:
        name:
          - xinit
          - feh
          - xserver-xorg-core
          - xserver-xorg-video-fbdev
          - imagemagick
          - kbd
        state: present
        install_recommends: no
      ignore_errors: yes
    
    # ============================================
    # KERNEL-LEVEL LOCKDOWN
    # ============================================
    
    - name: Disable SysRq keys permanently
      sysctl:
        name: kernel.sysrq
        value: '0'
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-disable-sysrq.conf
    
    - name: Create udev rule to disable keyboard on non-X ttys
      copy:
        dest: /etc/udev/rules.d/99-lock-keyboard.rules
        mode: '0644'
        content: |
          # Disable keyboard access on TTY1-6 and TTY8-12
          # This prevents TTY switching via Ctrl+Alt+F1-F12
          SUBSYSTEM=="tty", KERNEL=="tty[1-6]", MODE="0000"
          SUBSYSTEM=="tty", KERNEL=="tty[8-9]", MODE="0000"
          SUBSYSTEM=="tty", KERNEL=="tty1[0-2]", MODE="0000"
    
    - name: Reload udev rules
      command: udevadm control --reload-rules
      changed_when: true
    
    - name: Apply udev rules
      command: udevadm trigger
      changed_when: true
    
    # ============================================
    # DISABLE ALTERNATIVE CONSOLES
    # ============================================
    
    - name: Disable getty services on all TTYs except tty7
      systemd:
        name: "getty@tty{{ item }}.service"
        enabled: no
        masked: yes
      loop:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 8
        - 9
        - 10
        - 11
        - 12
      ignore_errors: yes
    
    - name: Stop getty services immediately
      systemd:
        name: "getty@tty{{ item }}.service"
        state: stopped
      loop:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 8
        - 9
        - 10
        - 11
        - 12
      ignore_errors: yes
    
    # ============================================
    # CREATE HARDENED DISPLAY SCRIPT
    # ============================================
    
    - name: Create hardened instruction display script
      copy:
        dest: /usr/local/bin/show-cli-instruction.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Display CLI instruction image with maximum lockdown
          
          IMAGE_PATH="{{ remote_image_path }}"
          
          # Force switch to tty7 and lock it
          chvt 7 2>/dev/null || true
          
          # Disable SysRq at runtime
          echo 0 > /proc/sys/kernel/sysrq 2>/dev/null || true
          
          # Lock all other TTYs
          for tty in /dev/tty{1..6} /dev/tty{8..12}; do
              if [ -e "$tty" ]; then
                  chmod 000 "$tty" 2>/dev/null || true
              fi
          done
          
          # Disable keyboard repeat and bell (reduces user interaction)
          kbdrate -r 0 -d 2000 2>/dev/null || true
          
          # If image doesn't exist, create a simple text-based one
          if [ ! -f "$IMAGE_PATH" ]; then
              command -v convert >/dev/null 2>&1 || apt-get install -y -qq imagemagick 2>/dev/null
              
              convert -size 1920x1080 xc:black \
                  -font DejaVu-Sans-Mono -pointsize 20 -fill '#ffffffff' \
                  -gravity center \
                  -annotate +0-400 '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣠⣴⠶⠶⣶⠶⠶⠶⠶⠶⠶⠶⠶⠶⢶⠶⠶⠶⠤⠤⠤⠤⣄⣀⣀⡀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-380 '⠀⠀⠀⠀⠀⠀⠀⠀⣠⡾⠋⠀⠀⠊⠀⠀⠀⠀⠀⠀⠀⠀⠒⠒⠒⠀⠀⠀⠀⠤⢤⣤⣄⠉⠉⠛⠛⠷⣦⣀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-360 '⠀⠀⠀⠀⠀⠀⠀⣰⠟⠀⠀⠀⠀⠀⠐⠋⢑⣤⣶⣶⣤⡢⡀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣠⣄⡂⠀⠀⠶⢄⠙⢷⣤⠀⠀⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-340 '⠀⠀⠀⠀⠀⠀⣸⡿⠚⠉⡀⠀⠀⠀⠀⢰⣿⣿⣿⣿⣿⣿⡄⠀⠀⠀⢢⠀⠀⡀⣰⣿⣿⣿⣿⣦⡀⠀⠀⠡⡀⢹⡆⠀⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-320 '⠀⠀⠀⠀⢀⣴⠏⠀⣀⣀⣀⡤⢤⣄⣠⣿⣿⣿⣿⣻⣿⣿⣷⠀⢋⣾⠈⠙⣶⠒⢿⣿⣿⣿⣿⡿⠟⠃⠀⡀⠡⠼⣧⡀⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-300 '⠀⠀⢀⣴⣿⢃⡴⢊⢽⣶⣤⣀⠀⠊⠉⠉⡛⢿⣿⣿⣿⠿⠋⢀⡀⠁⠀⠀⢸⣁⣀⣉⣉⣉⡉⠀⠩⡡⠀⣩⣦⠀⠈⠻⣦⡀⠀⠀⠀⠀' \
                  -annotate +0-280 '⠀⢠⡟⢡⠇⡞⢀⠆⠀⢻⣿⣿⣷⣄⠀⢀⠈⠂⠈⢁⡤⠚⡟⠉⠀⣀⣀⠀⠈⠳⣍⠓⢆⢀⡠⢀⣨⣴⣿⣿⡏⢀⡆⠀⢸⡇⠀⠀⠀⠀' \
                  -annotate +0-260 '⠀⣾⠁⢸⠀⠀⢸⠀⠀⠀⠹⣿⣿⣿⣿⣶⣬⣦⣤⡈⠀⠀⠇⠀⠛⠉⣩⣤⣤⣤⣿⣤⣤⣴⣾⣿⣿⣿⣿⣿⣧⠞⠀⠀⢸⡇⠀⠀⠀⠀' \
                  -annotate +0-240 '⠀⢹⣆⠸⠀⠀⢸⠀⠀⠀⠀⠘⢿⣿⣿⣿⣿⣿⣿⣟⣛⠛⠛⣛⡛⠛⠛⣛⣋⡉⠉⣡⠶⢾⣿⣿⣿⣿⣿⣿⡇⠀⠀⢀⣾⠃⠀⠀⠀⠀' \
                  -annotate +0-220 '⠀⠀⠻⣆⡀⠀⠈⢂⠀⠀⠀⠠⡈⢻⣿⣿⣿⣿⡟⠁⠈⢧⡼⠉⠙⣆⡞⠁⠈⢹⣴⠃⠀⢸⣿⣿⣿⣿⣿⣿⠃⠀⡆⣾⠃⠀⠀⠀⠀⠀' \
                  -annotate +0-200 '⠀⠀⠀⠈⢻⣇⠀⠀⠀⠀⠀⠀⢡⠀⠹⣿⣿⣿⣷⡀⠀⣸⡇⠀⠀⣿⠁⠀⠀⠘⣿⠀⠀⠘⣿⣿⣿⣿⣿⣿⠀⠀⣿⡇⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-180 '⠀⠀⠀⠀⠀⠹⣇⠀⠠⠀⠀⠀⠀⠡⠐⢬⡻⣿⣿⣿⣿⣿⣷⣶⣶⣿⣦⣤⣤⣤⣿⣦⣶⣿⣿⣿⣿⣿⣿⣿⠀⠀⣿⡇⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-160 '⠀⠀⠀⠀⠀⠀⠹⣧⡀⠡⡀⠀⠀⠀⠑⠄⠙⢎⠻⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣦⠀⢿⡇⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-140 '⠀⠀⠀⠀⠀⠀⠀⠈⠳⣤⡐⡄⠀⠀⠀⠈⠂⠀⠱⣌⠻⣿⣿⣿⣿⣿⣿⣿⠿⣿⠟⢻⡏⢻⣿⣿⣿⣿⣿⣿⣿⠀⢸⡇⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-120 '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠻⢮⣦⡀⠂⠀⢀⠀⠀⠈⠳⣈⠻⣿⣿⣿⡇⠘⡄⢸⠀⠀⣇⠀⣻⣿⣿⣿⣿⣿⡏⠀⠸⡇⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-100 '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠉⠛⢶⣤⣄⡑⠄⠀⠀⠈⠑⠢⠙⠻⢷⣶⣵⣞⣑⣒⣋⣉⣁⣻⣿⠿⠟⠱⠃⡸⠀⣧⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-80 '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠉⠛⠻⣷⣄⡀⠐⠢⣄⣀⡀⠀⠉⠉⠉⠉⠛⠙⠭⠭⠄⠒⠈⠀⠐⠁⢀⣿⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-60 '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠉⠛⠷⢦⣤⣤⣀⣀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣒⡠⠄⣠⡾⠃⠀⠀⠀⠀⠀⠀' \
                  -annotate +0-40 '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠉⠙⠛⠷⠶⣦⣤⣭⣤⣬⣭⣭⣴⠶⠛⠉⠀⠀⠀⠀⠀⠀⠀⠀' \
                  -font DejaVu-Sans-Bold -pointsize 60 -fill '#0986ecff' \
                  -annotate +0+100 "Hi Redteam" \
                  -pointsize 40 -fill white \
                  -annotate +0+200 "" \
                  -font DejaVu-Sans-Mono -pointsize 36 -fill '#00aaff' \
                  -annotate +0+280 "This system has been seized by the Federal Bureau of Investigations" \
                  "$IMAGE_PATH" 2>/dev/null || true
          fi
          
          # Create watchdog script that prevents killing feh
          cat > /tmp/display-watchdog.sh << 'WATCHDOG_EOF'
          #!/bin/bash
          IMAGE="$1"
          
          while true; do
              # Start feh in background
              /usr/bin/feh --fullscreen --hide-pointer --auto-reload --borderless \
                  --no-menus --draw-filename "$IMAGE" &
              FEH_PID=$!
              
              # Monitor the process
              while kill -0 "$FEH_PID" 2>/dev/null; do
                  sleep 1
                  # Ensure we stay on tty7
                  chvt 7 2>/dev/null || true
              done
              
              # If feh dies, restart immediately
              sleep 0.5
          done
          WATCHDOG_EOF
          chmod +x /tmp/display-watchdog.sh
          
          # Create X server config to disable dangerous key combinations
          cat > /tmp/xorg-lockdown.conf << 'XORG_EOF'
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "DontZap" "true"
              Option "DontZoom" "true"
              Option "DisableVidModeExtension" "true"
              Option "AllowNonLocalXvidtune" "false"
              Option "AllowMouseOpenFail" "true"
          EndSection
          
          Section "ServerLayout"
              Identifier "Lockdown"
              Option "DontVTSwitch" "true"
          EndSection
          XORG_EOF
          
          # Start X server with lockdown configuration and watchdog
          if [ -f "$IMAGE_PATH" ]; then
              xinit /tmp/display-watchdog.sh "$IMAGE_PATH" -- :0 vt7 \
                  -nocursor -s 0 -dpms -nolisten tcp \
                  -config /tmp/xorg-lockdown.conf 2>/dev/null
          else
              # Fallback blank screen
              xinit -- :0 vt7 -nocursor -s 0 -dpms -nolisten tcp \
                  -config /tmp/xorg-lockdown.conf 2>/dev/null
          fi
          
          # If X exits, restart the whole script
          exec "$0"
    
    - name: Display instruction display configured message
      debug:
        msg: "✓ Hardened instruction display script created on {{ inventory_hostname }}"
    
    # ============================================
    # CREATE SYSTEMD SERVICE WITH RESTART POLICY
    # ============================================
    
    - name: Create systemd service for CLI instruction display
      copy:
        dest: /etc/systemd/system/cli-instruction-display.service
        mode: '0644'
        content: |
          [Unit]
          Description=CLI Instruction Display (Hardened)
          After=systemd-user-sessions.service
          Before=getty@tty1.service
          Conflicts=getty@tty1.service getty@tty2.service getty@tty3.service
          Conflicts=getty@tty4.service getty@tty5.service getty@tty6.service
          
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/show-cli-instruction.sh
          Restart=always
          RestartSec=1
          StandardInput=tty
          TTYPath=/dev/tty7
          TTYReset=yes
          TTYVHangup=yes
          TTYVTDisallocate=yes
          
          # Security hardening
          ProtectSystem=full
          ProtectHome=yes
          NoNewPrivileges=false
          PrivateTmp=yes
          
          # Ensure high priority
          Nice=-10
          IOSchedulingClass=realtime
          IOSchedulingPriority=0
          
          [Install]
          WantedBy=multi-user.target
      
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
    
    - name: Enable CLI instruction display service
      systemd:
        name: cli-instruction-display.service
        enabled: yes
    
    - name: Display service configured message
      debug:
        msg: "✓ Hardened CLI instruction display service enabled on {{ inventory_hostname }}"
    
    # ============================================
    # ADDITIONAL LOCKDOWN MEASURES
    # ============================================
    
    - name: Disable Ctrl+Alt+Del
      systemd:
        name: ctrl-alt-del.target
        masked: yes
    
    - name: Create boot parameter to disable console blanking
      lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet consoleblank=0 vt.global_cursor_default=0"'
        backup: yes
      register: grub_updated
    
    - name: Update GRUB configuration
      command: update-grub
      when: grub_updated.changed
      ignore_errors: yes
    
    - name: Disable kernel console on all ttys except tty7
      copy:
        dest: /etc/systemd/system/console-lock.service
        mode: '0644'
        content: |
          [Unit]
          Description=Lock console access
          DefaultDependencies=no
          After=sysinit.target
          Before=basic.target
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/bash -c 'for i in {1..6} {8..12}; do chmod 000 /dev/tty$i 2>/dev/null || true; done'
          
          [Install]
          WantedBy=sysinit.target
    
    - name: Enable console lock service
      systemd:
        name: console-lock.service
        enabled: yes
        daemon_reload: yes
    
    # ============================================
    # CONFIGURE LOGIN MESSAGE
    # ============================================
    
    - name: Create login message (MOTD)
      copy:
        dest: /etc/motd
        mode: '0644'
        content: |
          
          ================================================================================
                              THIS SYSTEM HAS BEEN SEIZED
          ================================================================================
          
          The Federal Bureau of Investigations has seized this system for illegal activity
          
          ================================================================================
          
    
    - name: Display login message configured
      debug:
        msg: "✓ Login message configured on {{ inventory_hostname }}"
    
    # ============================================
    # FINAL STATUS
    # ============================================
    
    - name: Display completion message
      debug:
        msg: "✓ All hardened configuration completed on {{ inventory_hostname }}. Reboot will be initiated."

# ============================================
# REBOOT HOSTS
# ============================================

- name: Reboot all hosts
  hosts: kali_vms
  become: yes
  gather_facts: no
  tags: reboot
  
  tasks:
    - name: Reboot the system
      reboot:
        msg: "Rebooting to apply desktop environment changes"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      
    - name: Wait for system to come back online
      wait_for_connection:
        delay: 10
        timeout: 300

# ============================================
# POST-REBOOT VERIFICATION
# ============================================

- name: Verify Configuration
  hosts: kali_vms
  become: yes
  gather_facts: no
  tags: reboot
  
  tasks:
    - name: Check systemd default target
      command: systemctl get-default
      register: default_target
      changed_when: false
      
    - name: Verify multi-user target is set
      assert:
        that:
          - "'multi-user.target' in default_target.stdout"
        success_msg: "✓ {{ inventory_hostname }} is set to CLI mode"
        fail_msg: "✗ {{ inventory_hostname }} did not set CLI mode correctly"
    
    - name: Check if CLI instruction service is running
      systemd:
        name: cli-instruction-display.service
      register: service_status
      
    - name: Display service status
      debug:
        msg: "✓ CLI instruction display service status on {{ inventory_hostname }}: {{ service_status.status.ActiveState }}"
    
    - name: Verify SysRq is disabled
      command: cat /proc/sys/kernel/sysrq
      register: sysrq_status
      changed_when: false
      
    - name: Display SysRq status
      debug:
        msg: "✓ SysRq disabled: {{ sysrq_status.stdout == '0' }}"

# ============================================
# POST-PLAY SUMMARY
# ============================================

- name: Configuration Summary
  hosts: localhost
  gather_facts: no
  tags: always
  
  tasks:
    - name: Display summary
      debug:
        msg:
          - "========================================"
          - "  Hardened Configuration Summary"
          - "========================================"
          - "✓ All hosts have been configured"
          - "✓ All hosts have been rebooted"
          - "✓ Desktop environments are disabled"
          - "✓ TTY switching is disabled"
          - "✓ Keyboard shortcuts are disabled"
          - "✓ Display auto-restarts if killed"
          - "✓ Alternative consoles are locked"
          - "✓ Systems are now in locked CLI mode"
          - ""
          - "Users will see seizure screen ONLY"
          - "SSH is the only access method"
          - "========================================"